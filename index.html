<style>

<script>
const I18N = {
  de: {
    sub: "Softwareentwickler, Region Lüneburg",
    intro: "Ich arbeite hauptsächlich mit Python und Odoo: Schnittstellen über die External API, Automatisierung mit Windmill und eine Menge XML. Meine Ausbildung habe ich 2024 abgeschlossen. Nebenbei schreibe ich Tools, die ich selbst brauche, und stelle sie auf GitHub.",
    projects: "Projekte",
    clip: "Schaut bei Twitch-Streams mit und merkt, wenn im Chat gerade etwas los ist. Den Moment schneidet es als Hochkant-Clip und legt ihn in eine Warteschlange, in der ich ihn freigebe oder verwerfe. Ein Ausschlag im Chat allein reicht nicht: Es müssen viele verschiedene Leute schreiben, oder viele dasselbe, oder der Stream wird plötzlich laut. Der Upload zu YouTube Shorts ist gebaut, lief aber noch nicht mit echten Videos.",
    odooMeta: "VS-Code-Erweiterung, TypeScript",
    odoo: "Zeiterfassung für Odoo, ohne VS Code zu verlassen. Projekte und Tickets stehen in der Seitenleiste, die Zeit läuft als Timer in der Statusleiste. Zu einem Ticket legt die Erweiterung den Branch an, öffnet einen Draft-PR und verlinkt ihn im Ticket. Gibt es in vier Sprachen im Marketplace.",
    crypto: "Rechnet Krypto-Gewinne für die Anlage SO aus. Jeder Kauf wird einzeln nach FIFO verfolgt, mit eigener Jahresfrist. Es liest Exporte von Bitpanda und Kraken und schreibt eine Excel-Mappe, in der man jede Zahl nachrechnen kann. Läuft lokal, die Daten verlassen den Rechner nicht.",
    other: "English",
  },
  en: {
    sub: "Software developer, Lüneburg area, Germany",
    intro: "I mostly work with Python and Odoo: integrations through the External API, automation with Windmill, and a fair amount of XML. I finished my apprenticeship in 2024. On the side I write tools I need myself and put them on GitHub.",
    projects: "Projects",
    clip: "Watches Twitch streams and notices when chat suddenly gets busy. It cuts that moment into a vertical clip and puts it in a queue where I approve or reject it. A spike in chat alone is not enough: it also needs many different people writing, many writing the same thing, or the stream getting loud. The YouTube Shorts upload is built but has not been used with real videos yet.",
    odooMeta: "VS Code extension, TypeScript",
    odoo: "Odoo time tracking without leaving VS Code. Projects and tickets sit in the sidebar and the time runs as a timer in the status bar. For a ticket it creates the branch, opens a draft PR and links it back to the ticket. Available in four languages on the Marketplace.",
    crypto: "Works out crypto gains for the German tax return. Every purchase is tracked on its own with FIFO and its own one-year holding period. It reads Bitpanda and Kraken exports and writes an Excel workbook where every number can be checked by hand. Runs locally, the data never leaves your machine.",
    other: "Deutsch",
  },
};

let current = "de";
function setLang(lang) {
  current = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = I18N[lang][el.getAttribute("data-i18n")];
  });
  document.getElementById("lang").textContent = I18N[lang].other;
  try { localStorage.setItem("lang", lang); } catch (e) {}
}
document.getElementById("lang").addEventListener("click", () => setLang(current === "de" ? "en" : "de"));

let saved = null;
try { saved = localStorage.getItem("lang"); } catch (e) {}
setLang(saved || (navigator.language && navigator.language.startsWith("de") ? "de" : "en"));
</script>
</body>
</html>
